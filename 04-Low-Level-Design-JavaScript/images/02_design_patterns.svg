<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%" style="background-color: #181818; font-family: 'Inter', sans-serif;">
    <rect width="100%" height="100%" fill="#181818"/>
    <text x="500" y="45" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#38bdf8" text-anchor="middle">Design Patterns Classification Architecture</text>
    
    <!-- Creational -->
    <rect x="40" y="80" width="280" height="380" rx="10" fill="#1e1e1e" stroke="#38bdf8" stroke-width="2"/>
    <text x="180" y="115" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle">Creational (5)</text>
    <text x="180" y="140" font-size="12" fill="#a0a0a0" text-anchor="middle">Object Creation Mechanisms</text>
    
    <rect x="60" y="160" width="240" height="45" rx="6" fill="#2d2d2d"/><text x="180" y="187" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">Singleton</text>
    <rect x="60" y="215" width="240" height="45" rx="6" fill="#2d2d2d"/><text x="180" y="242" font-size="14" font-weight="600" fill="#e0e0e0" text-anchor="middle">Factory Method</text>
    <rect x="60" y="270" width="240" height="45" rx="6" fill="#2d2d2d"/><text x="180" y="297" font-size="14" font-weight="600" fill="#e0e0e0" text-anchor="middle">Abstract Factory</text>
    <rect x="60" y="325" width="240" height="45" rx="6" fill="#2d2d2d"/><text x="180" y="352" font-size="14" font-weight="600" fill="#fbbf24" text-anchor="middle">Builder</text>
    <rect x="60" y="380" width="240" height="45" rx="6" fill="#2d2d2d"/><text x="180" y="407" font-size="14" font-weight="600" fill="#e0e0e0" text-anchor="middle">Prototype</text>

    <!-- Structural -->
    <rect x="360" y="80" width="280" height="380" rx="10" fill="#1e1e1e" stroke="#818cf8" stroke-width="2"/>
    <text x="500" y="115" font-size="18" font-weight="700" fill="#818cf8" text-anchor="middle">Structural (7)</text>
    <text x="500" y="140" font-size="12" fill="#a0a0a0" text-anchor="middle">Class &amp; Object Composition</text>
    
    <rect x="380" y="160" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="500" y="182" font-size="13" fill="#e0e0e0" text-anchor="middle">Adapter</text>
    <rect x="380" y="202" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="500" y="224" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Decorator</text>
    <rect x="380" y="244" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="500" y="266" font-size="13" fill="#e0e0e0" text-anchor="middle">Facade</text>
    <rect x="380" y="286" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="500" y="308" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Proxy</text>
    <rect x="380" y="328" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="500" y="350" font-size="13" fill="#e0e0e0" text-anchor="middle">Composite</text>
    <rect x="380" y="370" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="500" y="392" font-size="13" fill="#e0e0e0" text-anchor="middle">Bridge</text>
    <rect x="380" y="412" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="500" y="434" font-size="13" fill="#e0e0e0" text-anchor="middle">Flyweight</text>

    <!-- Behavioral -->
    <rect x="680" y="80" width="280" height="380" rx="10" fill="#1e1e1e" stroke="#4ade80" stroke-width="2"/>
    <text x="820" y="115" font-size="18" font-weight="700" fill="#4ade80" text-anchor="middle">Behavioral (10)</text>
    <text x="820" y="140" font-size="12" fill="#a0a0a0" text-anchor="middle">Algorithmic Communication</text>
    
    <rect x="700" y="160" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="820" y="182" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Strategy</text>
    <rect x="700" y="202" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="820" y="224" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Observer (Pub/Sub)</text>
    <rect x="700" y="244" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="820" y="266" font-size="13" fill="#fbbf24" font-weight="600" text-anchor="middle">Command (Undo/Redo)</text>
    <rect x="700" y="286" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="820" y="308" font-size="13" fill="#e0e0e0" text-anchor="middle">State</text>
    <rect x="700" y="328" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="820" y="350" font-size="13" fill="#e0e0e0" text-anchor="middle">Chain of Responsibility</text>
    <rect x="700" y="370" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="820" y="392" font-size="13" fill="#e0e0e0" text-anchor="middle">Template Method / Iterator</text>
    <rect x="700" y="412" width="240" height="35" rx="5" fill="#2d2d2d"/><text x="820" y="434" font-size="13" fill="#e0e0e0" text-anchor="middle">Mediator / Memento / Visitor</text>
</svg>